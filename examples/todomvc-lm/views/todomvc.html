<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Template • TodoMVC</title>
		<link rel="stylesheet" href="node_modules/todomvc-common/base.css">
		<link rel="stylesheet" href="node_modules/todomvc-app-css/index.css">
		<link rel="stylesheet" href="css/app.css">
	</head>
	<body>
		<section class="todoapp">
			<header class="header">
				<h1>todos</h1>
				<input class="new-todo" placeholder="What needs to be done?" autofocus
				       ws-var="newTodo" ws-onkeydown="newTodoKey" ws-onafterrender="newTodoFocus">
			</header>
			<section class="main ${mainClass}" id="main">
				<input id="toggle-all" class="toggle-all" type="checkbox" ws-attr="toggleAttr" ws-onclick="toggleAll">
				<label for="toggle-all">Mark all as complete</label>
				<ul class="todo-list" ws-hole="todos">
					<template name="todoItem">
						<li class="${itemClass}">
							<div class="view">
								<input class="toggle" type="checkbox" ws-attr="toggleAttr" ws-onclick="toggle">
								<label ws-ondblclick="editStart">${title}</label>
								<button class="destroy" ws-onclick="destroy"></button>
							</div>
							<input class="edit" ws-var="editText" ws-onblur="editCommit" ws-onkeydown="editKey" ws-onafterrender="editFocus">
						</li>
					</template>
				</ul>
			</section>
			<footer class="footer ${footerClass}" id="footer">
				<span class="todo-count" ws-hole="count"></span>
				<ul class="filters">
					<li><a class="${allClass}" href="#/" ws-onclick="filterAll">All</a></li>
					<li><a class="${activeClass}" href="#/active" ws-onclick="filterActive">Active</a></li>
					<li><a class="${completedClass}" href="#/completed" ws-onclick="filterCompleted">Completed</a></li>
				</ul>
				<button class="clear-completed ${clearClass}" ws-onclick="clearCompleted">Clear completed</button>
			</footer>
		</section>
		<footer class="info">
			<p>Double-click to edit a todo</p>
			<p>Written in OCaml with WebSharper.UI</p>
			<p>Part of <a href="http://todomvc.com">TodoMVC</a></p>
		</footer>
	</body>
</html>
